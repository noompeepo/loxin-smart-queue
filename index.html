<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Loxin Smart Queue System (v24 Grouped Confirmation Status + 1-Min Default + Printer Off Default)</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; background-color: #020617; color: #f8fafc; margin: 0; }
    @keyframes pulse-ring {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.85); }
      70% { transform: scale(1); box-shadow: 0 0 0 24px rgba(234, 179, 8, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    @keyframes flash-bg {
      0%, 100% { background-color: #eab308; color: #0f172a; }
      50% { background-color: #ef4444; color: #ffffff; }
    }
    @keyframes marquee-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .alarm-active { animation: flash-bg 0.9s infinite !important; }
    .pulse-btn { animation: pulse-ring 1.3s infinite; }
    .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee-scroll 22s linear infinite; }
    #thermal-print-area { display: none; }
    @media print {
      html, body { margin: 0 !important; padding: 0 !important; background: #ffffff !important; color: #000000 !important; }
      #app { display: none !important; }
      #thermal-print-area {
        display: block !important; margin: 0 auto !important;
        font-family: 'Prompt', Tahoma, sans-serif !important;
        color: #000000 !important; background: #ffffff !important; text-align: center !important;
      }
      #thermal-print-area.paper-58mm { width: 48mm !important; padding: 2mm 1mm 6mm 1mm !important; }
      #thermal-print-area.paper-80mm { width: 72mm !important; padding: 3mm 2mm 8mm 2mm !important; }
      #thermal-print-area.paper-a4 { width: 148mm !important; padding: 12mm 10mm !important; border: 2px solid #000 !important; margin-top: 10mm !important; }
      #thermal-print-area.paper-label { width: 50mm !important; height: 30mm !important; padding: 1.5mm !important; }
      #thermal-print-area * { color: #000000 !important; background: transparent !important; }
      .receipt-divider { border-top: 1px dashed #000000 !important; margin: 6px 0 !important; }
      #print-qr-container { display: flex !important; justify-content: center !important; align-items: center !important; margin: 6px auto !important; }
      #print-qr-container img, #print-qr-container canvas { margin: 0 auto !important; }
    }
  </style>
  <style id="dynamic-page-print-style">@page { size: 58mm auto; margin: 0mm !important; }</style>

      if (!notice) return '';

      if (notice.presetKey === 'preset_id' && notice.text === NOTICE_UI_LABELS['th-TH'].preset_id) {
        return ui.preset_id;
      }
      if (notice.presetKey === 'preset_near' && notice.text === NOTICE_UI_LABELS['th-TH'].preset_near) {

    function detectPhoneDefaultLanguage() {
      const candidates = (navigator.languages && navigator.languages.length > 0)
        ? navigator.languages
        : [navigator.language || 'en-US'];
      for (const item of candidates) {
        const raw = String(item).toLowerCase();
        if (raw.startsWith('th')) return 'th-TH';
        if (raw.startsWith('zh')) return 'zh-CN';
        if (raw.startsWith('ja')) return 'ja-JP';
        if (raw.startsWith('ko')) return 'ko-KR';
        if (raw.startsWith('lo')) return 'lo-LA';
        if (raw.startsWith('my')) return 'my-MM';
        if (raw.startsWith('km')) return 'km-KH';
        if (raw.startsWith('vi')) return 'vi-VN';
        if (raw.startsWith('ms')) return 'ms-MY';
        if (raw.startsWith('id')) return 'id-ID';
        if (raw.startsWith('ru')) return 'ru-RU';
        if (raw.startsWith('fr')) return 'fr-FR';
        if (raw.startsWith('de')) return 'de-DE';
        if (raw.startsWith('es')) return 'es-ES';
        if (raw.startsWith('ar')) return 'ar-SA';
        if (raw.startsWith('en')) return 'en-US';
      }
      return 'en-US';
    }

    function isIntercomMatch(target) {
      if (!target || target === 'all') return true;
      if (state.mode === 'customer') {
        const myQ = state.queues.find(x => x.id === state.customerQueueId);
        if (!myQ) return true;
        if (target === 'active') return myQ.status === 'called';
        if (target === 'waiting') return myQ.status === 'waiting';
        if (Array.isArray(target)) return target.includes(myQ.id);
        return myQ.id === target;
      }
      return true;
    }

    window.startTwoWayIntercom = async () => {

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert('เบราว์เซอร์นี้ไม่รองรับการเข้าถึงไมโครโฟนสำหรับ Intercom');

        intercomStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }

        intercomAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = intercomAudioCtx.createMediaStreamSource(intercomStream);

    function encodeFloat32ToPCM16Base64(float32Arr) {
      const buf = new ArrayBuffer(float32Arr.length * 2);
      const view = new DataView(buf);
      for (let i = 0; i < float32Arr.length; i++) {
        let s = Math.max(-1, Math.min(1, float32Arr[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      const bytes = new Uint8Array(buf);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function decodePCM16Base64ToFloat32(b64) {
      const binary = atob(b64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      const view = new DataView(bytes.buffer);
      const samples = new Float32Array(len / 2);
      for (let i = 0; i < samples.length; i++) {
        samples[i] = view.getInt16(i * 2, true) / 0x8000;
      }
      return samples;
    }

    function downsampleBuffer(buffer, inRate, outRate) {
      if (outRate >= inRate) return buffer;
      const ratio = inRate / outRate;
      const newLen = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLen);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i];
          count++;
        }
        result[offsetResult] = count > 0 ? accum / count : 0;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function buildEscPosCommands(q, waitingAhead) {
      const ESC = '\x1B';
      const GS = '\x1D';
      const shop = state.shopName || 'LOXIN GROUP';
      const srv = q.service || 'Counter 1';
      const num = q.number || 'A001';
      const cust = q.customerName || 'Customer';
      const timeStr = new Date(q.targetTime).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      const scanUrl = getTicketScanUrl(q);

      // Standard ESC/POS plain ASCII/UTF-8 receipt payload + cut command
      let cmd = ESC + '@'; // Initialize
      cmd += ESC + 'a' + '\x01'; // Center align
      cmd += ESC + 'E' + '\x01' + shop + '\n' + ESC + 'E' + '\x00';
      cmd += srv + '\n';
      cmd += '--------------------------------\n';
      cmd += 'QUEUE NUMBER\n';
      cmd += GS + '!' + '\x22' + num + '\n' + GS + '!' + '\x00';
      cmd += 'Customer: ' + cust + '\n';
      cmd += 'Waiting ahead: ' + waitingAhead + '\n';
      cmd += '--------------------------------\n';
      cmd += 'Scan QR for Live Alert:\n' + scanUrl + '\n';
      cmd += 'Est. Call Time: ' + timeStr + '\n';
      cmd += '--------------------------------\n';
      cmd += 'Thank you!\n\n\n\n';
      cmd += GS + 'V' + '\x41' + '\x03'; // Partial cut
      return new TextEncoder().encode(cmd);
    }

    function sendCustomerHeartbeat() {
      if (state.mode !== 'customer' || !state.customerQueueId) return;
      const q = state.queues.find(x => x.id === state.customerQueueId);
      const payload = {
        queueId: state.customerQueueId,
        scanned: true,
        onlineAt: Date.now(),
        soundReady: state.soundUnlocked,
        acknowledged: Boolean(state.acknowledgedIds[state.customerQueueId]),
        closedScreen: Boolean(state.customerClosedScreen),
        lang: state.mobileLanguage,
        userAgent: navigator.userAgent.includes('iPhone') ? 'iPhone' : (navigator.userAgent.includes('Android') ? 'Android' : 'Mobile')
      };
      if (q) {
        q.qrScanned = true;
        q.qrOnlineAt = payload.onlineAt;
        q.qrSoundReady = payload.soundReady;
        q.qrAck = payload.acknowledged;
        q.qrClosed = payload.closedScreen;
        q.qrLang = payload.lang;
        q.qrDevice = payload.userAgent;
      }
      if (channel) {
        try { channel.postMessage({ type: 'HEARTBEAT', payload }); } catch (e) {}
      }
      try {
        if (mqttClient && state.mqttConnected) {
          mqttClient.publish(getHeartbeatTopic(), JSON.stringify(payload), { qos: 1 });
        }
      } catch (e) {}
    }

    function applyHeartbeatToQueue(hb) {
      if (!hb || !hb.queueId) return;
      const q = state.queues.find(x => x.id === hb.queueId);
      if (q) {
        q.qrScanned = true;
        q.qrOnlineAt = hb.onlineAt || Date.now();
        q.qrSoundReady = Boolean(hb.soundReady);
        q.qrAck = Boolean(hb.acknowledged);
        q.qrClosed = Boolean(hb.closedScreen);
        if (hb.lang) q.qrLang = hb.lang;
        if (hb.userAgent) q.qrDevice = hb.userAgent;
        if (state.mode === 'staff') {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.queues));
        }
        safeBackgroundRender();
      }
    }

    function initAutoCloudSync() {
      if (typeof mqtt === 'undefined') return;
      try {
        if (mqttClient) { try { mqttClient.end(); } catch (e) {} }
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
          clientId: 'loxin_' + Math.random().toString(16).substring(2, 10),
          clean: true,
          reconnectPeriod: 3000
        });
        mqttClient.on('connect', () => {
          state.mqttConnected = true;
          mqttClient.subscribe(getMqttTopic(), { qos: 1 });
          mqttClient.subscribe(getHeartbeatTopic(), { qos: 1 });
          mqttClient.subscribe(getVoiceTopic(), { qos: 0 });
          mqttClient.subscribe(getIntercomTopic(), { qos: 0 });
          mqttClient.subscribe(getNoticeTopic(), { qos: 1 });
          if (state.mode === 'staff' && state.queues.length > 0) broadcastCloudState();
          if (state.mode === 'customer') {
            sendCustomerHeartbeat();
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(sendCustomerHeartbeat, 4000);
          }
          safeBackgroundRender();
        });
        mqttClient.on('message', (topic, message) => {
          try {
            const payload = JSON.parse(message.toString());
            if (topic === getHeartbeatTopic()) {
              applyHeartbeatToQueue(payload);
              return;
            }
            if (topic === getIntercomTopic()) {
              handleIncomingIntercomPacket(payload);
              return;
            }
            if (topic === getVoiceTopic()) {
              handleIncomingVoiceBroadcast(payload);
              return;
            }
            if (topic === getNoticeTopic()) {
              handleIncomingImportantNotice(payload);
              return;
            }
            if (payload && Array.isArray(payload.queues)) {
              const merged = payload.queues.map(inc => {
                const existing = state.queues.find(e => e.id === inc.id);
                if (existing && state.mode === 'staff') {
                  return {
                    ...inc,
                    qrScanned: existing.qrScanned || inc.qrScanned,
                    qrOnlineAt: Math.max(existing.qrOnlineAt || 0, inc.qrOnlineAt || 0),
                    qrSoundReady: existing.qrSoundReady || inc.qrSoundReady,
                    qrAck: inc.status === 'called' && inc.calledAt !== existing.calledAt ? false : (existing.qrAck || inc.qrAck),
                    qrClosed: existing.qrClosed || inc.qrClosed,
                    qrLang: existing.qrLang || inc.qrLang,
                    qrDevice: existing.qrDevice || inc.qrDevice
                  };
                }
                return inc;
              });
              state.queues = merged;
              if (payload.tvMediaUrl !== undefined && state.mode === 'display' && state.tvLocalFiles.length === 0) {
                state.tvMediaUrl = payload.tvMediaUrl;
              }
              if (state.mode !== 'customer') {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.queues));
              }
              if (state.mode === 'display') {
                checkAndSpeakDisplayAnnouncement();
              }
              checkAndTriggerCustomerAlarm();
              if (!state.showBroadcastMsgModal && !state.showMicModal && !state.showSettingsModal) {
                render();
              }
            }
          } catch (err) {}
        });
        mqttClient.on('close', () => { state.mqttConnected = false; safeBackgroundRender(); });
      } catch (e) {}
    }

    function broadcastCloudState() {
      try {
        if (mqttClient && state.mqttConnected) {
          mqttClient.publish(getMqttTopic(), JSON.stringify({
            updatedAt: Date.now(),
            tvMediaUrl: state.tvMediaUrl,
            queues: state.queues
          }), { qos: 1, retain: true });
        }
      } catch (e) {}
    }

    function loadLocalQueues() {
      try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) state.queues = JSON.parse(saved); } catch (e) {}
    }

    function saveAndSyncQueues() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.queues));
        if (channel) channel.postMessage({ type: 'SYNC', queues: state.queues, tvMediaUrl: state.tvMediaUrl });
        broadcastCloudState();
      } catch (e) {}
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        loadLocalQueues();
        if (state.mode === 'display') checkAndSpeakDisplayAnnouncement();
        checkAndTriggerCustomerAlarm();
        safeBackgroundRender();
      } else if (e.key === TV_MEDIA_URL_KEY) {
        state.tvMediaUrl = localStorage.getItem(TV_MEDIA_URL_KEY) || '';
        safeBackgroundRender();
      } else if (e.key === 'loxin_tv_media_ping_v24') {
        loadTvMediaFromIndexedDB();
      }
    });
    if (channel) {
      channel.onmessage = (e) => {
        if (e.data && e.data.type === 'TV_MEDIA_UPDATED') {
          loadTvMediaFromIndexedDB();
        } else if (e.data && e.data.type === 'VOICE_CHUNK') {
          handleIncomingVoiceBroadcast(e.data.payload);
        } else if (e.data && e.data.type === 'IMPORTANT_NOTICE') {
          handleIncomingImportantNotice(e.data.payload);
        } else if (e.data && e.data.type === 'HEARTBEAT') {
          applyHeartbeatToQueue(e.data.payload);
        } else if (e.data && e.data.type === 'SYNC') {
          state.queues = e.data.queues;
          if (e.data.tvMediaUrl !== undefined && state.tvLocalFiles.length === 0) {
            state.tvMediaUrl = e.data.tvMediaUrl;
          }
          if (state.mode === 'display') checkAndSpeakDisplayAnnouncement();
          checkAndTriggerCustomerAlarm();
          safeBackgroundRender();
        }
      };
    }

    window.print58mmSlip = async function(queueId) {
      const q = state.queues.find(item => item.id === queueId);
      if (!q) return;
      const waitingAhead = state.queues.filter(x => x.status === 'waiting' && x.createdAt < q.createdAt).length;
      const scanUrl = getTicketScanUrl(q);

      // Direct ESC/POS hardware printing modes (USB / Serial / Network)
      if (state.printerMode === 'usb' && usbPrinterDevice) {
        try {
          const data = buildEscPosCommands(q, waitingAhead);
          const epOut = usbPrinterDevice.configuration.interfaces[0].alternate.endpoints.find(e => e.direction === 'out');
          await usbPrinterDevice.transferOut(epOut ? epOut.endpointNumber : 1, data);
          return;
        } catch (e) {
          console.warn('USB print fallback to browser print:', e);
        }
      }
      if (state.printerMode === 'serial' && serialPrinterPort && serialPrinterPort.writable) {
        try {
          const writer = serialPrinterPort.writable.getWriter();
          await writer.write(buildEscPosCommands(q, waitingAhead));
          writer.releaseLock();
          return;
        } catch (e) {
          console.warn('Serial print fallback to browser print:', e);
        }
      }
      if (state.printerMode === 'network' && state.printerNetworkUrl) {
        try {
          fetch(state.printerNetworkUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ queue: q, shopName: state.shopName, scanUrl, waitingAhead, paperSize: state.printerPaperSize })
          }).catch(() => {});
        } catch (e) {}
      }

      // Standard & Multi-Size Browser Driver Print (58mm, 80mm, A5/A4, Label 50x30mm)
      const printArea = document.getElementById('thermal-print-area');
      const paper = state.printerPaperSize || '58mm';
      printArea.className = 'paper-' + paper;
      const qrSize = paper === 'a4' ? 210 : (paper === '80mm' ? 170 : (paper === 'label' ? 84 : 136));

      document.getElementById('p-shop-name').textContent = state.shopName;
      document.getElementById('p-service-name').textContent = q.service;
      document.getElementById('p-queue-number').textContent = q.number;
      document.getElementById('p-queue-number').style.fontSize = paper === 'a4' ? '72px' : (paper === '80mm' ? '52px' : (paper === 'label' ? '26px' : '42px'));
      document.getElementById('p-customer-name').textContent = `คุณ ${q.customerName}`;
      document.getElementById('p-wait-info').textContent = `คิวรอหน้าคุณ: ${waitingAhead} คิว`;
      document.getElementById('p-target-time').textContent = `เวลาแจ้งเตือน: ${new Date(q.targetTime).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.`;
      document.getElementById('p-issued-time').textContent = `ออกบัตร: ${new Date(q.createdAt).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' })}`;
      const qrBox = document.getElementById('print-qr-container');
      qrBox.innerHTML = '';
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrBox, { text: scanUrl, width: qrSize, height: qrSize, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L });
      } else {
        qrBox.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&data=${encodeURIComponent(scanUrl)}" width="${qrSize}" height="${qrSize}" />`;
      }
      setTimeout(() => { window.print(); }, 280);
    };

    function playLoudMobileAlert(queueNumber, serviceName) {
      try {
        const audioEl = document.getElementById('mobile-chime-audio');
        if (audioEl) { audioEl.currentTime = 0; audioEl.volume = 1.0; audioEl.play().catch(() => {}); }
      } catch (e) {}
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [587.33, 880, 1174.66].forEach((f, i) => {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.22);
          gain.gain.setValueAtTime(0.01, now + i * 0.22);
          gain.gain.exponentialRampToValueAtTime(0.65, now + i * 0.22 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.75);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + i * 0.22); osc.stop(now + i * 0.22 + 0.8);
        });
      } catch (e) {}
      try { if ('vibrate' in navigator) navigator.vibrate([600, 200, 600, 200, 900]); } catch (e) {}
    }

    function speakQueue(queueNumber, serviceName, langOverride = null) {
      if (!state.ttsEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        let targetLang = langOverride || (state.mode === 'customer' ? state.mobileLanguage : state.ttsLanguage) || 'th-TH';
        const spelledQueue = queueNumber.split('').join(' ');
        const voices = window.speechSynthesis.getVoices();
        let speakLang = targetLang;
        let text = getMobileStrings(targetLang).ttsPhrase(spelledQueue, serviceName);

        if (voices.length > 0) {
          const langPrefix = targetLang.substring(0, 2).toLowerCase();
          const hasVoice = voices.some(v => v.lang.toLowerCase().startsWith(langPrefix));
          if (!hasVoice && langPrefix !== 'en') {
            speakLang = 'en-US';
            text = MOBILE_I18N['en-US'].ttsPhrase(spelledQueue, serviceName);
          }
        }

        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = speakLang;
        msg.rate = 0.90;
        msg.volume = 1.0;
        if (voices.length > 0) {
          const matchVoice = voices.find(v => v.lang.toLowerCase().startsWith(speakLang.substring(0, 2).toLowerCase()));
          if (matchVoice) msg.voice = matchVoice;
        }
        window.speechSynthesis.speak(msg);
      } catch (e) {}
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

      const latest = calledList.sort((a, b) => (b.calledAt || b.createdAt) - (a.calledAt || a.createdAt))[0];
      const key = `${latest.id}_${latest.calledAt || 0}_${latest.callCount || 1}`;
      if (state.lastSpokenCallKey !== key) {
        state.lastSpokenCallKey = key;
        playLoudMobileAlert(latest.number, latest.service);
        setTimeout(() => speakQueue(latest.number, latest.service, state.ttsLanguage), 900);
      }
    }

    function saveTvMediaToIndexedDB(filesArray) {
      try {
        const req = indexedDB.open('LoxinSmartQueueMediaDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('media')) db.createObjectStore('media');
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction('media', 'readwrite');
          const store = tx.objectStore('media');
          store.put(filesArray, 'tvLocalMediaFiles');
          tx.oncomplete = () => {
            if (channel) {
              try { channel.postMessage({ type: 'TV_MEDIA_UPDATED' }); } catch (err) {}
            }
            try { localStorage.setItem('loxin_tv_media_ping_v24', String(Date.now())); } catch (err) {}
          };
        };
      } catch (err) {}
    }

    function loadTvMediaFromIndexedDB() {
      try {
        const req = indexedDB.open('LoxinSmartQueueMediaDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('media')) db.createObjectStore('media');
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction('media', 'readonly');
          const store = tx.objectStore('media');
          const getReq = store.get('tvLocalMediaFiles');
          getReq.onsuccess = () => {
            const list = getReq.result;
            if (Array.isArray(list) && list.length > 0) {
              state.tvLocalFiles = list.map(item => ({
                name: item.name,
                url: URL.createObjectURL(item.blob),
                type: item.type
              }));
              state.tvSlideIndex = 0;
              setupTvSlideshowTimer();
              render();
            }
          };
        };
      } catch (err) {}
    }

    function parseYouTubeEmbedUrl(url) {
      if (!url) return null;
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = url.match(regExp);
      if (match && match[1]) {
        const vid = match[1];
        return `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&loop=1&playlist=${vid}&controls=0&rel=0`;
      }
      return null;
    }

                      <input id="newOpName" type="text" placeholder="ชื่อแสดงผล (เช่น จนท.ช่อง 3)" onclick="event.stopPropagation(); this.focus();" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                      <input id="newOpCounter" type="text" value="ช่องบริการ 3" placeholder="ช่องบริการเริ่มต้น" onclick="event.stopPropagation(); this.focus();" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                    </div>
                    <div class="flex justify-between items-center gap-2">
                      <select id="newOpRole" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                        <option value="staff">สิทธิ์: Staff (เจ้าหน้าที่ออกคิว)</option>
                        <option value="admin">สิทธิ์: Admin (ผู้ดูแลระบบ)</option>
                      </select>
                      <button onclick="addNewOperatorAccount()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold">+ เพิ่มบัญชี</button>
                    </div>
                  </div>
                ` : ''}

                <div class="flex justify-end pt-2">
                  <button onclick="state.showUserMgmtModal = false; render();" class="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-xs">ปิดหน้าต่าง</button>
                </div>
              </div>
            </div>
          `;
        })() : ''}
      `;

      if (previewQueue) renderQR('qrcode-slip-preview', previewUrl, 132);
    }

    const _origRender = render;
    render = function() {
      const active = document.activeElement;
      const activeId = active && active.id ? active.id : null;
      const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
      const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
      _origRender();
      if (activeId) {
        const nextEl = document.getElementById(activeId);
        if (nextEl && (nextEl.tagName === 'INPUT' || nextEl.tagName === 'TEXTAREA')) {
          nextEl.focus();
          if (selStart !== null && selEnd !== null) {
            try { nextEl.setSelectionRange(selStart, selEnd); } catch (e) {}
          }
        }
      }
    };

    loadLocalQueues();
    loadTvMediaFromIndexedDB();
    initAutoCloudSync();
    render();
  </script>
</body>
</html>
