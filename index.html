  <title>Loxin Smart Queue System (v5 Auto-Cloud + Thermal 58mm)</title>
  <link rel="manifest" href="manifest.json" />

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; background-color: #020617; color: #f8fafc; margin: 0; }
    @keyframes pulse-ring {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.85); }
      70% { transform: scale(1); box-shadow: 0 0 0 24px rgba(234, 179, 8, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    @keyframes flash-bg {
      0%, 100% { background-color: #eab308; color: #0f172a; }
      50% { background-color: #ef4444; color: #ffffff; }
    }
    .alarm-active {
      animation: flash-bg 0.9s infinite !important;
    }
    .pulse-btn {
      animation: pulse-ring 1.3s infinite;
    }

    /* 58mm Thermal Receipt Printer Styles (Actual Print Width ~48mm) */
    #thermal-print-area { display: none; }
    @media print {
      @page { size: 58mm auto; margin: 0mm !important; }
      html, body {
        width: 58mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      #app { display: none !important; }
      #thermal-print-area {
        display: block !important;
        width: 48mm !important;
        margin: 0 auto !important;
        padding: 2mm 1mm 6mm 1mm !important;
        font-family: 'Prompt', Tahoma, sans-serif !important;
        color: #000000 !important;
        background: #ffffff !important;
        text-align: center !important;
      }
      #thermal-print-area * { color: #000000 !important; background: transparent !important; }
      .receipt-divider { border-top: 1px dashed #000000 !important; margin: 6px 0 !important; }
      #print-qr-container {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        margin: 6px auto !important;
      }
      #print-qr-container img, #print-qr-container canvas {
        margin: 0 auto !important;
        width: 136px !important;
        height: 136px !important;
      }
    }
  </style>

    const DEFAULT_RENDER_URL = window.location.protocol.startsWith('http')
      ? window.location.href.split('?')[0]
      : 'https://loxin-smart-queue.onrender.com';

    let channel = null;
    try { channel = new BroadcastChannel('loxin_queue_sync_v5'); } catch (e) {}

    let state = {
      queues: [],
      mode: 'staff', // 'staff' | 'kiosk' | 'customer'
      customerQueueId: null,
      soundUnlocked: false,
      acknowledgedIds: {},
      alarmPlayingId: null,
      ttsEnabled: true,
      autoPrint58mm: localStorage.getItem(AUTO_PRINT_KEY) !== 'false',
      shopName: localStorage.getItem(SHOP_NAME_KEY) || 'LOXIN GROUP CO., LTD.',
      publicBaseUrl: localStorage.getItem(PUBLIC_URL_KEY) || DEFAULT_RENDER_URL,
      roomId: localStorage.getItem(ROOM_ID_KEY) || 'loxin-ceo-noom-q1',
      mqttConnected: false,
      showSettingsModal: false
    };

    let mqttClient = null;
    let audioCtx = null;
    let alarmInterval = null;
    let wakeLockObj = null;

    async function requestMobileWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLockObj = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    // Parse URL parameters when customer scans QR Code from 58mm paper slip
    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) {
      state.mode = 'customer';
      state.customerQueueId = params.get('q');
      const qId = params.get('q');
      const qNum = params.get('n') || 'A001';
      const qSrv = params.get('s') || 'ช่องบริการ 1';
      const qTarget = Number(params.get('t')) || (Date.now() + 300000);
      const qWait = Number(params.get('w')) || 0;
      const qName = params.get('c') || 'ลูกค้า';
      if (params.get('shop')) state.shopName = params.get('shop');
      if (params.get('r')) state.roomId = params.get('r');

      setTimeout(() => {
        if (!state.queues.find(x => x.id === qId)) {
          state.queues.push({
            id: qId,
            number: qNum,
            service: qSrv,
            customerName: qName,
            targetTime: qTarget,
            waitingAheadInit: qWait,
            status: 'waiting',
            createdAt: Date.now()
          });
          render();
        }
      }, 50);
    }

    // =========================================================================
    // ZERO-CONFIG AUTO CLOUD SYNC (WebSockets MQTT - Works Out of the Box!)
    // =========================================================================
    function getMqttTopic() {
      return `loxin_smart_queue_v5/${state.roomId}/state`;
    }

    function initAutoCloudSync() {
      if (typeof mqtt === 'undefined') return;
      try {
        if (mqttClient) {
          try { mqttClient.end(); } catch (e) {}
        }
        // Connect to public WebSocket broker over TLS (works on both Windows file:/// and Render https://)
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
          clientId: 'loxin_' + Math.random().toString(16).substring(2, 10),
          clean: true,
          reconnectPeriod: 3000
        });

        mqttClient.on('connect', () => {
          state.mqttConnected = true;
          const topic = getMqttTopic();
          mqttClient.subscribe(topic, { qos: 1 });
          // If staff mode has queues, publish retained state so newly scanned phones get instant status
          if (state.mode !== 'customer' && state.queues.length > 0) {
            broadcastCloudState();
          }
          render();
        });

        mqttClient.on('message', (topic, message) => {
          try {
            const payload = JSON.parse(message.toString());
            if (payload && Array.isArray(payload.queues)) {
              state.queues = payload.queues;
              if (state.mode !== 'customer') {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.queues));
              }
              checkAndTriggerCustomerAlarm();
              render();
            }
          } catch (err) {}
        });

        mqttClient.on('close', () => {
          state.mqttConnected = false;
          render();
        });
      } catch (e) {}
    }

    function broadcastCloudState() {
      try {
        if (mqttClient && state.mqttConnected) {
          const payload = JSON.stringify({
            updatedAt: Date.now(),
            queues: state.queues
          });
          // Publish with retain=true so any phone scanning the QR code immediately receives the latest queue list!
          mqttClient.publish(getMqttTopic(), payload, { qos: 1, retain: true });
        }
      } catch (e) {}
    }

    function loadLocalQueues() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) state.queues = JSON.parse(saved);
      } catch (e) {}
    }

    function saveAndSyncQueues() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.queues));
        if (channel) channel.postMessage({ type: 'SYNC', queues: state.queues });
        broadcastCloudState();
      } catch (e) {}
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        loadLocalQueues();
        checkAndTriggerCustomerAlarm();
        render();
      }
    });

    if (channel) {
      channel.onmessage = (e) => {
        if (e.data && e.data.type === 'SYNC') {
          state.queues = e.data.queues;
          checkAndTriggerCustomerAlarm();
          render();
        }
      };
    }

    async function persistQueue(item) {
      const idx = state.queues.findIndex(q => q.id === item.id);
      if (idx >= 0) state.queues[idx] = item;
      else state.queues.push(item);
      saveAndSyncQueues();
      render();
    }

    async function removeQueue(id) {
      state.queues = state.queues.filter(q => q.id !== id);
      saveAndSyncQueues();
      render();
    }

    function getTicketScanUrl(q) {
      let base = state.publicBaseUrl.trim();
      if (!base) base = DEFAULT_RENDER_URL;
      const waitingAhead = state.queues.filter(x => x.status === 'waiting' && x.createdAt < q.createdAt).length;
      const paramsObj = {
        q: q.id,
        n: q.number,
        s: q.service,
        t: String(q.targetTime),
        w: String(waitingAhead),
        c: q.customerName,
        shop: state.shopName,
        r: state.roomId
      };
      const query = new URLSearchParams(paramsObj);
      return `${base}?${query.toString()}`;
    }

    window.print58mmSlip = function(queueId) {
      const q = state.queues.find(item => item.id === queueId);
      if (!q) return;

      const waitingAhead = state.queues.filter(x => x.status === 'waiting' && x.createdAt < q.createdAt).length;
      const scanUrl = getTicketScanUrl(q);

      document.getElementById('p-shop-name').textContent = state.shopName;
      document.getElementById('p-service-name').textContent = q.service;
      document.getElementById('p-queue-number').textContent = q.number;
      document.getElementById('p-customer-name').textContent = `คุณ ${q.customerName}`;
      document.getElementById('p-wait-info').textContent = `คิวรอหน้าคุณ: ${waitingAhead} คิว`;
      document.getElementById('p-target-time').textContent = `เวลาแจ้งเตือน: ${new Date(q.targetTime).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.`;
      document.getElementById('p-issued-time').textContent = `ออกบัตร: ${new Date(q.createdAt).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' })}`;

      const qrBox = document.getElementById('print-qr-container');
      qrBox.innerHTML = '';
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrBox, {
          text: scanUrl,
          width: 136,
          height: 136,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.L
        });
      } else {
        qrBox.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=136x136&data=${encodeURIComponent(scanUrl)}" width="136" height="136" />`;
      }

      setTimeout(() => { window.print(); }, 280);
    };

    // =========================================================================
    // TRIPLE-LAYER MOBILE SOUND & VIBRATION ENGINE (WAV + WebAudio + TTS + Vibrate)
    // =========================================================================
    function playLoudMobileAlert(queueNumber, serviceName) {
      try {
        const audioEl = document.getElementById('mobile-chime-audio');
        if (audioEl) {
          audioEl.currentTime = 0;
          audioEl.volume = 1.0;
          audioEl.play().catch(() => {});
        }
      } catch (e) {}

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const freqs = [587.33, 880, 1174.66];
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + i * 0.22);
          gain.gain.setValueAtTime(0.01, now + i * 0.22);
          gain.gain.exponentialRampToValueAtTime(0.65, now + i * 0.22 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.75);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.22);
          osc.stop(now + i * 0.22 + 0.8);
        });
      } catch (e) {}

      try {
        if ('vibrate' in navigator) {
          navigator.vibrate([600, 200, 600, 200, 900]);
        }
      } catch (e) {}

      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(`🔔 ถึงคิว ${queueNumber} ของคุณแล้ว!`, {
            body: `กรุณาติดต่อ ${serviceName} ได้เลยครับ`,
            vibrate: [500, 200, 500]
          });
        }
      } catch (e) {}
    }

    function speakThaiQueue(queueNumber, serviceName) {
      if (!state.ttsEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(`ถึงคิวของท่านแล้วค่ะ หมายเลขคิว ${queueNumber.split('').join(' ')} กรุณาติดต่อ ${serviceName} ค่ะ`);
        msg.lang = 'th-TH';
        msg.rate = 0.95;
        msg.volume = 1.0;
        window.speechSynthesis.speak(msg);
      } catch (e) {}
    }

    function startMobileAlarm(q) {
      if (!q || state.acknowledgedIds[q.id]) return;
      if (state.alarmPlayingId === q.id) return;
      state.alarmPlayingId = q.id;

      playLoudMobileAlert(q.number, q.service);
      setTimeout(() => speakThaiQueue(q.number, q.service), 1100);

      if (alarmInterval) clearInterval(alarmInterval);
      alarmInterval = setInterval(() => {
        playLoudMobileAlert(q.number, q.service);
      }, 3200);
      render();
    }

    function checkAndTriggerCustomerAlarm() {
      const activeCustQ = state.queues.find(q => q.id === state.customerQueueId);
      if (activeCustQ && activeCustQ.status === 'called' && state.soundUnlocked && !state.acknowledgedIds[activeCustQ.id]) {
        startMobileAlarm(activeCustQ);
      }
    }

    window.stopMobileAlarm = () => {
      if (state.customerQueueId) {
        state.acknowledgedIds[state.customerQueueId] = true;
      }
      state.alarmPlayingId = null;
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      try {
        const audioEl = document.getElementById('mobile-chime-audio');
        if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
        if ('vibrate' in navigator) navigator.vibrate(0);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } catch (e) {}
      render();
    };

    window.unlockMobileAudio = async () => {
      state.soundUnlocked = true;
      playLoudMobileAlert('ทดสอบ', 'ช่องบริการ');
      requestMobileWakeLock();
      try {
        if ('Notification' in window && Notification.permission === 'default') {
          await Notification.requestPermission();
        }
      } catch (e) {}
      render();

      const q = state.queues.find(item => item.id === state.customerQueueId);
      if (q && (q.status === 'called' || Date.now() >= q.targetTime)) {
        q.status = 'called';
        startMobileAlarm(q);
      }
    };

    window.testSoundAndVibrateNow = () => {
      state.soundUnlocked = true;
      playLoudMobileAlert('A001', 'ช่องบริการ 1');
      setTimeout(() => speakThaiQueue('A001', 'ช่องบริการ 1'), 1100);
      render();
    };

    window.issueQueueTicket = async (prefixOverride = null, serviceOverride = null, delaySeconds = null) => {
      const prefix = prefixOverride || document.getElementById('qPrefix')?.value || 'A';
      const service = serviceOverride || document.getElementById('qService')?.value || 'ช่องบริการ 1';
      const customerName = document.getElementById('qName')?.value || 'ลูกค้าทั่วไป';
      const timeInput = document.getElementById('qTime')?.value;

      const count = state.queues.filter(q => q.number.startsWith(prefix)).length + 1;
      const number = `${prefix}${String(count).padStart(3, '0')}`;
      const id = `Q${Date.now().toString().slice(-6)}`;

      let targetTime = Date.now() + 5 * 60 * 1000;
      if (delaySeconds !== null) {
        targetTime = Date.now() + delaySeconds * 1000;
      } else if (timeInput) {
        const [hh, mm] = timeInput.split(':').map(Number);
        const d = new Date();
        d.setHours(hh, mm, 0, 0);
        if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
        targetTime = d.getTime();
      }

      const item = {
        id,
        number,
        service,
        customerName,
        targetTime,
        status: 'waiting',
        createdAt: Date.now()
      };

      await persistQueue(item);
      state.customerQueueId = id;
      render();

      if (state.autoPrint58mm) {
        window.print58mmSlip(id);
      }
    };

    window.callQueueNow = async (id) => {
      const item = state.queues.find(q => q.id === id);
      if (!item) return;
      // Reset acknowledged state if staff calls again
      delete state.acknowledgedIds[id];
      const updated = { ...item, status: 'called', calledAt: Date.now(), callCount: (item.callCount || 0) + 1 };
      await persistQueue(updated);
      playLoudMobileAlert(item.number, item.service);
      setTimeout(() => speakThaiQueue(item.number, item.service), 900);
    };

    window.completeQueue = async (id) => {
      const item = state.queues.find(q => q.id === id);
      if (!item) return;
      await persistQueue({ ...item, status: 'completed' });
    };

    window.deleteQueueItem = async (id) => {
      await removeQueue(id);
    };

    window.selectCustomerPreview = (id) => {
      state.customerQueueId = id;
      render();
    };

    window.switchMode = (mode) => {
      state.mode = mode;
      render();
    };

    window.toggleAutoPrint = () => {
      state.autoPrint58mm = !state.autoPrint58mm;
      localStorage.setItem(AUTO_PRINT_KEY, String(state.autoPrint58mm));
      render();
    };

    window.saveSystemSettings = () => {
      const shopVal = document.getElementById('shopNameInput').value.trim() || 'LOXIN GROUP CO., LTD.';
      const pubUrlVal = document.getElementById('publicUrlInput').value.trim() || DEFAULT_RENDER_URL;
      const roomVal = document.getElementById('roomIdInput').value.trim() || 'loxin-ceo-noom-q1';

      state.shopName = shopVal;
      state.publicBaseUrl = pubUrlVal;
      state.roomId = roomVal;

      localStorage.setItem(SHOP_NAME_KEY, shopVal);
      localStorage.setItem(PUBLIC_URL_KEY, pubUrlVal);
      localStorage.setItem(ROOM_ID_KEY, roomVal);

      state.showSettingsModal = false;
      initAutoCloudSync();
      render();
    };

    window.copyQueueUrl = (id) => {
      const q = state.queues.find(x => x.id === id);
      if (!q) return;
      const url = getTicketScanUrl(q);
      navigator.clipboard.writeText(url);
      alert('คัดลอกลิงก์เช็คสถานะคิวเรียบร้อยแล้ว:\n' + url);
    };

    setInterval(() => {
      const now = Date.now();
      let changed = false;
      state.queues.forEach(q => {
        if (q.status === 'waiting' && now >= q.targetTime) {
          q.status = 'called';
          changed = true;
          if (state.mode === 'staff') {
            playLoudMobileAlert(q.number, q.service);
            setTimeout(() => speakThaiQueue(q.number, q.service), 900);
          }
        }
      });

      if (changed) {
        saveAndSyncQueues();
        render();
      }

      checkAndTriggerCustomerAlarm();

      document.querySelectorAll('[data-countdown]').forEach(el => {
        const target = Number(el.getAttribute('data-countdown'));
        const diff = Math.max(0, Math.floor((target - now) / 1000));
        const m = String(Math.floor(diff / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        el.textContent = diff > 0 ? `${m}:${s} นาที` : 'ถึงเวลาเรียกคิวแล้ว!';
      });
    }, 1000);

    function renderQR(elementId, url, size = 128) {
      setTimeout(() => {
        const el = document.getElementById(elementId);
        if (!el) return;
        el.innerHTML = '';
        if (typeof QRCode !== 'undefined') {
          new QRCode(el, {
            text: url,
            width: size,
            height: size,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.L
          });
        } else {
          el.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}" alt="QR" width="${size}" height="${size}" />`;
        }
      }, 30);
    }

    function render() {
      const app = document.getElementById('app');

      // ==========================================================
      // MODE 1: CUSTOMER MOBILE STATUS CHECK VIEW
      // ==========================================================
      if (state.mode === 'customer') {
        const q = state.queues.find(item => item.id === state.customerQueueId) || state.queues[state.queues.length - 1];
        const isAlarming = q && q.status === 'called' && !state.acknowledgedIds[q.id];
        const currentCalling = state.queues.filter(x => x.status === 'called').slice(-1)[0];
        const waitingAhead = q
          ? (state.queues.length > 1
              ? state.queues.filter(x => x.status === 'waiting' && x.createdAt < q.createdAt).length
              : (q.waitingAheadInit || 0))
          : 0;

        app.innerHTML = `
          ${!state.soundUnlocked ? `
            <div class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center">
              <div class="w-20 h-20 rounded-full bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-4xl mb-4 pulse-btn">
                🔔
              </div>
              <h2 class="text-2xl font-extrabold text-white mb-2">บัตรคิวหมายเลข ${q ? q.number : ''}</h2>
              <p class="text-sm text-slate-300 max-w-xs mb-6 leading-relaxed">
                กรุณาแตะปุ่มด้านล่าง 1 ครั้ง เพื่อเปิดระบบ <b>เสียงกระดิ่งแจ้งเตือน + เสียงเรียกคิว + ระบบสั่น</b> เมื่อถึงคิวของคุณ
              </p>
              <button onclick="unlockMobileAudio()" class="w-full max-w-xs py-4 px-6 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-base shadow-2xl pulse-btn">
                🔊 แตะเพื่อเปิดเสียงแจ้งเตือน & ระบบสั่น
              </button>
              <p class="text-[11px] text-slate-400 mt-4">
                * แนะนำให้เปิดเสียงมือถือและเปิดหน้าจอนี้ค้างไว้
              </p>
            </div>
          ` : ''}

          <div class="min-h-screen flex flex-col items-center justify-between p-5 ${isAlarming ? 'alarm-active' : 'bg-slate-950'} transition-all duration-300">
            <div class="w-full max-w-md flex justify-between items-center">
              <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full ${state.mqttConnected ? 'bg-emerald-400' : 'bg-amber-400'}"></div>
                <span class="font-bold tracking-wider text-xs ${isAlarming ? 'text-slate-950' : 'text-amber-400'}">${state.shopName}</span>
              </div>
              <button onclick="testSoundAndVibrateNow()" class="text-xs px-3 py-1 rounded-full border ${isAlarming ? 'border-slate-900 text-slate-950 font-bold' : 'border-amber-500/40 text-amber-400'}">
                🔊 ทดสอบเสียง/สั่น
              </button>
            </div>

            ${q ? `
              <div class="w-full max-w-md bg-slate-900/95 border border-amber-500/30 rounded-3xl p-6 text-center shadow-2xl text-white my-auto">
                <div class="flex justify-between items-center bg-slate-950/90 px-4 py-2.5 rounded-2xl border border-slate-800 mb-5 text-xs">
                  <span class="text-slate-400">สถานะคิวของคุณ:</span>
                  ${q.status === 'waiting' ? `
                    <span class="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 font-bold">⏳ กำลังรอคิว (อีก ${waitingAhead} คิว)</span>
                  ` : q.status === 'called' ? `
                    <span class="px-2.5 py-0.5 rounded-full bg-emerald-500 text-slate-950 font-bold animate-pulse">🔔 ถึงคิวของคุณแล้ว!</span>
                  ` : `
                    <span class="px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400">✅ เสร็จสิ้นแล้ว</span>
                  `}
                </div>

                <span class="inline-block px-4 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 mb-2">
                  ${q.service}
                </span>
                <p class="text-slate-400 text-xs">หมายเลขคิวของคุณ</p>
                <div class="text-7xl font-extrabold text-amber-400 my-2 tracking-wider">${q.number}</div>
                <p class="text-slate-300 text-sm font-medium mb-5">คุณ ${q.customerName}</p>

                <div class="grid grid-cols-2 gap-3 mb-5">
                  <div class="bg-slate-950/80 rounded-2xl p-3.5 border border-slate-800">
                    <div class="text-[11px] text-slate-400">คิวที่กำลังเรียกตอนนี้</div>
                    <div class="text-2xl font-bold text-emerald-400 mt-1">${currentCalling ? currentCalling.number : (q.status === 'called' ? q.number : '-')}</div>
                  </div>
                  <div class="bg-slate-950/80 rounded-2xl p-3.5 border border-slate-800">
                    <div class="text-[11px] text-slate-400">เวลาแจ้งเตือนนัดหมาย</div>
                    <div class="text-lg font-bold text-white mt-1">
                      ${new Date(q.targetTime).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.
                    </div>
                    <div class="text-[11px] text-amber-400" data-countdown="${q.targetTime}">กำลังคำนวณ...</div>
                  </div>
