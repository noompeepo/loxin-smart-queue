  <title>Loxin Smart Queue System (v9 Per-Queue Multi-Language Sync + Thermal 58mm)</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif; background-color: #020617; color: #f8fafc; margin: 0; }
    @keyframes pulse-ring {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.85); }
      70% { transform: scale(1); box-shadow: 0 0 0 24px rgba(234, 179, 8, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }
    @keyframes flash-bg {
      0%, 100% { background-color: #eab308; color: #0f172a; }
      50% { background-color: #ef4444; color: #ffffff; }
    }
    .alarm-active { animation: flash-bg 0.9s infinite !important; }
    .pulse-btn { animation: pulse-ring 1.3s infinite; }
    #thermal-print-area { display: none; }
    @media print {
      @page { size: 58mm auto; margin: 0mm !important; }
      html, body { width: 58mm !important; margin: 0 !important; padding: 0 !important; background: #ffffff !important; color: #000000 !important; }
      #app { display: none !important; }
      #thermal-print-area {
        display: block !important; width: 48mm !important; margin: 0 auto !important;
        padding: 2mm 1mm 6mm 1mm !important; font-family: 'Prompt', Tahoma, sans-serif !important;
        color: #000000 !important; background: #ffffff !important; text-align: center !important;
      }
      #thermal-print-area * { color: #000000 !important; background: transparent !important; }
      .receipt-divider { border-top: 1px dashed #000000 !important; margin: 6px 0 !important; }
      #print-qr-container { display: flex !important; justify-content: center !important; align-items: center !important; margin: 6px auto !important; }
      #print-qr-container img, #print-qr-container canvas { margin: 0 auto !important; width: 136px !important; height: 136px !important; }
    }
  </style>

    <div style="font-size: 10px; font-weight: 600;" id="p-customer-name">ลูกค้าทั่วไป</div>
    <div style="font-size: 10px;" id="p-wait-info">คิวรอหน้าคุณ: 0 คิว</div>
    <div class="receipt-divider"></div>
    <div style="font-size: 10px; font-weight: 700;">สแกน QR เพื่อเช็คสถานะคิว</div>

    <div id="print-qr-container"></div>
    <div style="font-size: 9px; font-weight: 600;" id="p-target-time">เวลาแจ้งเตือน: --:-- น.</div>
    <div class="receipt-divider"></div>
    <div style="font-size: 8px;" id="p-issued-time">วันที่พิมพ์: --/--/---- --:--</div>
    <div style="font-size: 9px; font-weight: 600; margin-top: 3px;">ขอบคุณที่ใช้บริการครับ</div>
    <div style="font-size: 8px; margin-top: 8px;">.</div>
  </div>
  <script>
    const STORAGE_KEY = 'loxin_smart_queue_v9';
    const PUBLIC_URL_KEY = 'loxin_smart_queue_public_url_v9';
    const SHOP_NAME_KEY = 'loxin_smart_queue_shop_name_v9';
    const AUTO_PRINT_KEY = 'loxin_smart_queue_auto_print_v9';
    const ROOM_ID_KEY = 'loxin_smart_queue_room_id_v9';
    const DEFAULT_RENDER_URL = window.location.protocol.startsWith('http') ? window.location.href.split('?')[0] : 'https://loxin-smart-queue.onrender.com';

    const LANG_LABELS = {
      'th-TH': '🇹🇭 ไทย',
      'en-US': '🇬🇧 English',
      'zh-CN': '🇨🇳 中文',
      'ja-JP': '🇯🇵 日本語',
      'ko-KR': '🇰🇷 한국어'
    };

    let channel = null;
    try { channel = new BroadcastChannel('loxin_queue_sync_v9'); } catch (e) {}

    let state = {
      queues: [],
      mode: 'staff',
      customerQueueId: null,
      soundUnlocked: false,
      acknowledgedIds: {},
      alarmPlayingId: null,
      ttsEnabled: true,
      ttsLanguage: localStorage.getItem('loxin_smart_queue_lang_v9') || 'th-TH',
      autoPrint58mm: localStorage.getItem(AUTO_PRINT_KEY) !== 'false',
      shopName: localStorage.getItem(SHOP_NAME_KEY) || 'LOXIN GROUP CO., LTD.',
      publicBaseUrl: localStorage.getItem(PUBLIC_URL_KEY) || DEFAULT_RENDER_URL,
      roomId: localStorage.getItem(ROOM_ID_KEY) || 'loxin-ceo-noom-q1',
      mqttConnected: false,
      showSettingsModal: false
    };

    let mqttClient = null, audioCtx = null, alarmInterval = null, wakeLockObj = null;

    async function requestMobileWakeLock() {
      try { if ('wakeLock' in navigator) wakeLockObj = await navigator.wakeLock.request('screen'); } catch (e) {}
    }

    // Parse URL parameters when customer scans QR Code from 58mm paper slip
    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) {
      state.mode = 'customer';
      state.customerQueueId = params.get('q');
      const qId = params.get('q'), qNum = params.get('n') || 'A001', qSrv = params.get('s') || 'ช่องบริการ 1';
      const qTarget = Number(params.get('t')) || (Date.now() + 300000), qWait = Number(params.get('w')) || 0, qName = params.get('c') || 'ลูกค้า';
      const qLang = params.get('l') || 'th-TH';
      state.ttsLanguage = qLang;
      if (params.get('shop')) state.shopName = params.get('shop');
      if (params.get('r')) state.roomId = params.get('r');
      setTimeout(() => {
        if (!state.queues.find(x => x.id === qId)) {
          state.queues.push({
            id: qId,
            number: qNum,
            service: qSrv,
            customerName: qName,
            targetTime: qTarget,
            waitingAheadInit: qWait,
            lang: qLang,
            status: 'waiting',
            createdAt: Date.now()
          });
          render();
        }
      }, 50);
    }

    function getMqttTopic() { return `loxin_smart_queue_v9/${state.roomId}/state`; }

    function initAutoCloudSync() {
      if (typeof mqtt === 'undefined') return;
      try {
        if (mqttClient) { try { mqttClient.end(); } catch (e) {} }
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
          clientId: 'loxin_' + Math.random().toString(16).substring(2, 10),
          clean: true,
          reconnectPeriod: 3000
        });
        mqttClient.on('connect', () => {
          state.mqttConnected = true;
          mqttClient.subscribe(getMqttTopic(), { qos: 1 });
          if (state.mode !== 'customer' && state.queues.length > 0) broadcastCloudState();
          render();
        });
        mqttClient.on('message', (topic, message) => {
          try {
            const payload = JSON.parse(message.toString());
            if (payload && Array.isArray(payload.queues)) {
              state.queues = payload.queues;
              if (state.mode === 'customer') {
                const myQ = state.queues.find(x => x.id === state.customerQueueId);
                if (myQ && myQ.lang) {
                  state.ttsLanguage = myQ.lang;
                } else if (payload.ttsLanguage) {
                  state.ttsLanguage = payload.ttsLanguage;
                }
              } else {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.queues));
              }
              checkAndTriggerCustomerAlarm();
              render();
            }
          } catch (err) {}
        });
        mqttClient.on('close', () => { state.mqttConnected = false; render(); });
      } catch (e) {}
    }

    function broadcastCloudState() {
      try {
        if (mqttClient && state.mqttConnected) {
          mqttClient.publish(getMqttTopic(), JSON.stringify({
            updatedAt: Date.now(),
            ttsLanguage: state.ttsLanguage,
            queues: state.queues
          }), { qos: 1, retain: true });
        }
      } catch (e) {}
    }

    function loadLocalQueues() {
      try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) state.queues = JSON.parse(saved); } catch (e) {}
    }

    function saveAndSyncQueues() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.queues));
        if (channel) channel.postMessage({ type: 'SYNC', queues: state.queues, ttsLanguage: state.ttsLanguage });
        broadcastCloudState();
      } catch (e) {}
    }

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        loadLocalQueues();
        checkAndTriggerCustomerAlarm();
        render();
      }
    });
    if (channel) {
      channel.onmessage = (e) => {
        if (e.data && e.data.type === 'SYNC') {
          state.queues = e.data.queues;
          if (state.mode === 'customer') {
            const myQ = state.queues.find(x => x.id === state.customerQueueId);
            if (myQ && myQ.lang) state.ttsLanguage = myQ.lang;
            else if (e.data.ttsLanguage) state.ttsLanguage = e.data.ttsLanguage;
          }
          checkAndTriggerCustomerAlarm();
          render();
        }
      };
    }

    async function persistQueue(item) {
      const idx = state.queues.findIndex(q => q.id === item.id);
      if (idx >= 0) state.queues[idx] = item; else state.queues.push(item);
      saveAndSyncQueues(); render();
    }

    async function removeQueue(id) {
      state.queues = state.queues.filter(q => q.id !== id);
      saveAndSyncQueues(); render();
    }

    function getTicketScanUrl(q) {
      let base = state.publicBaseUrl.trim() || DEFAULT_RENDER_URL;
      const waitingAhead = state.queues.filter(x => x.status === 'waiting' && x.createdAt < q.createdAt).length;
      const query = new URLSearchParams({
        q: q.id,
        n: q.number,
        s: q.service,
        t: String(q.targetTime),
        w: String(waitingAhead),
        c: q.customerName,
        l: q.lang || state.ttsLanguage,
        shop: state.shopName,
        r: state.roomId
      });

    function playLoudMobileAlert(queueNumber, serviceName) {
      try {
        const audioEl = document.getElementById('mobile-chime-audio');
        if (audioEl) { audioEl.currentTime = 0; audioEl.volume = 1.0; audioEl.play().catch(() => {}); }
      } catch (e) {}
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [587.33, 880, 1174.66].forEach((f, i) => {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.22);
          gain.gain.setValueAtTime(0.01, now + i * 0.22);
          gain.gain.exponentialRampToValueAtTime(0.65, now + i * 0.22 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.22 + 0.75);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + i * 0.22); osc.stop(now + i * 0.22 + 0.8);
        });
      } catch (e) {}
      try { if ('vibrate' in navigator) navigator.vibrate([600, 200, 600, 200, 900]); } catch (e) {}
    }

    function speakQueue(queueNumber, serviceName, langOverride = null) {
      if (!state.ttsEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        let lang = langOverride || state.ttsLanguage || 'th-TH';
        let text = '';
        const spelledQueue = queueNumber.split('').join(' ');
        if (lang === 'th-TH') {
          text = `ขอเชิญหมายเลขคิว ${spelledQueue} ติดต่อ ${serviceName} ค่ะ`;
        } else if (lang === 'en-US') {
          text = `Queue number ${spelledQueue}, please proceed to ${serviceName}`;
        } else if (lang === 'zh-CN') {
          text = `请 ${spelledQueue} 号, 到 ${serviceName}`;
        } else if (lang === 'ja-JP') {
          text = `お待ちの ${spelledQueue} 番、 ${serviceName} までお越しください`;
        } else if (lang === 'ko-KR') {
          text = `대기번호 ${spelledQueue} 번, ${serviceName} 으로 와주시기 바랍니다`;
        } else {
          text = `Queue ${spelledQueue} to ${serviceName}`; lang = 'en-US';
        }
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = lang; msg.rate = 0.90; msg.volume = 1.0;
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
          const matchVoice = voices.find(v => v.lang.startsWith(lang.substring(0, 2)));
          if (matchVoice) msg.voice = matchVoice;
        }
        window.speechSynthesis.speak(msg);
      } catch (e) {}
    }

      state.ttsLanguage = targetLang;
      playLoudMobileAlert(q.number, q.service);

      alarmInterval = setInterval(() => {

      const id = `Q${Date.now().toString().slice(-6)}`;
      let targetTime = Date.now() + 5 * 60 * 1000;
      if (delaySeconds !== null) targetTime = Date.now() + delaySeconds * 1000;
      else if (timeInput) {
        const [hh, mm] = timeInput.split(':').map(Number);

      // Stamp the dispenser's active language onto this ticket!
      const item = {

        number,
        service,
        customerName,
        targetTime,
        lang: state.ttsLanguage,
        status: 'waiting',
